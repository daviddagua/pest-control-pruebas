<!DOCTYPE html>
<html lang="es">

<body data-rol="cliente" data-menu="servicios">

  <main class="contenido" id="contenido">

    <div class="encabezado-pagina"><div><h1>Servicios y visitas</h1><p>Tus visitas programadas y el historial de servicios realizados.</p></div></div>
    <section class="tarjeta">
      <h2>Próximas visitas</h2>
      <ul class="lista" id="lista-proximas-cliente"></ul>

      <h2>Historial</h2>
      <div class="tabla-contenedor">
        <table>
          <thead><tr><th scope="col">N° ODS</th><th scope="col">Fecha</th><th scope="col">Servicio</th><th scope="col">Área</th><th scope="col">Técnico</th><th scope="col">Estado</th></tr></thead>
          <tbody id="tabla-servicios-cliente"></tbody>
        </table>
      </div>
    </section>
  </main>


  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/certificado.js"></script>
