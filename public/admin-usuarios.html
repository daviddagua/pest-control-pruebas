<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="David Liz Dagua">
  <title>Usuarios y roles | PEST CONTROL</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-rol="admin" data-menu="usuarios">
  <!-- La barra superior, el menú lateral y la navegación inferior los crea js/app.js según el rol -->
  <main class="contenido" id="contenido">

    <div class="encabezado-pagina">
      <div>
        <h1>Usuarios y roles</h1>
        <p>Crea usuarios internos y define si son Administradores o Técnicos (tabla Rol).</p>
      </div>
      <button class="btn btn-primario" id="btn-nuevo-usuario">+ Nuevo usuario</button>
    </div>

    <section class="tarjeta">
      <div class="tabla-contenedor">
        <table>
          <thead><tr><th scope="col">Usuario</th><th scope="col">Correo</th><th scope="col">Rol</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead>
          <tbody id="tabla-usuarios"></tbody>
        </table>
      </div>
      <p class="nota-info">Las contraseñas se guardan cifradas (bcrypt), nunca como texto (RNF-05).</p>
    </section>
  </main>

  <div class="modal" id="modal-usuario" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-usuario">
    <div class="modal-caja">
      <div class="modal-cabecera">
        <h2 id="titulo-modal-usuario">Nuevo usuario</h2>
        <button type="button" data-cerrar="modal-usuario" aria-label="Cerrar">&times;</button>
      </div>
      <form class="modal-cuerpo" id="form-usuario" novalidate>
        <div class="campo">
          <label for="usu-nombre">Nombre completo <span class="obligatorio" aria-hidden="true">*</span></label>
          <input type="text" id="usu-nombre" required>
          <p class="mensaje-error"></p>
        </div>
        <div class="fila-campos">
        <div class="campo">
          <label for="usu-documento">Cédula <span class="obligatorio" aria-hidden="true">*</span></label>
          <input type="text" id="usu-documento" required data-tipo="documento" inputmode="numeric">
          <p class="mensaje-error"></p>
        </div>
          <div class="campo">
            <label for="usu-rol">Rol <span class="obligatorio" aria-hidden="true">*</span></label>
            <select id="usu-rol" required><option value="">Selecciona...</option><option>Administrador</option><option>Técnico</option></select>
            <p class="mensaje-error"></p>
          </div>
        </div>
        <div class="campo">
          <label for="usu-correo">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
          <input type="email" id="usu-correo" required>
          <p class="mensaje-error"></p>
        </div>
        <div class="campo">
          <label for="usu-clave">Contraseña temporal <span class="obligatorio" aria-hidden="true">*</span></label>
          <input type="password" id="usu-clave" required data-tipo="clave" autocomplete="new-password">
          <small>Mínimo 6 caracteres, con letras y números.</small>
          <p class="mensaje-error"></p>
        </div>
        <div class="modal-pie">
          <button type="button" class="btn btn-secundario" data-cerrar="modal-usuario">Cancelar</button>
          <button type="submit" class="btn btn-primario">Crear usuario</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
