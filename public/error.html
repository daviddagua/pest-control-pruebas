<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="David Liz Dagua">
  <title>Error | PEST CONTROL</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="acceso">

  Pantalla de manejo de errores (compartida por todo el sistema, EV01) 
  <main class="acceso-caja" aria-labelledby="error-titulo">
    <div class="acceso-cabecera">
      <div class="error-icono" aria-hidden="true">!</div>
      <p class="error-codigo" id="error-codigo">ERR 401</p>
      <h1 id="error-titulo">Credenciales inválidas</h1>
    </div>
    <div class="acceso-cuerpo">
      <p id="error-detalle" style="text-align:center;margin-bottom:1.2rem">
        El usuario o la contraseña no son correctos.
      </p>
      <a href="index.html" class="btn btn-primario btn-bloque" id="error-accion">Reintentar</a>
      <div class="acceso-enlaces">
        <p><a href="index.html">Volver al inicio de sesión</a></p>
      </div>
    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/acceso.js"></script>
</body>
</html>
