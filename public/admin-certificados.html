<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="David Liz Dagua">
  <title>Certificados | PEST CONTROL</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-rol="admin" data-menu="certificados">
  La barra superior, el menú lateral y la navegación inferior los crea js/app.js según el rol
  <main class="contenido" id="contenido">

    <div class="encabezado-pagina">
      <div>
        <h1>Certificados (historial)</h1>
        <p>Certificados generados automáticamente al finalizar cada servicio (RF17, RNF-09).</p>
      </div>
      
    </div>

    <section class="tarjeta">
      <div class="herramientas">
        <label for="buscar-certificado" class="oculto">Buscar certificado</label>
        <input type="search" id="buscar-certificado" placeholder="🔍 Buscar por N° ODS o cliente">
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead><tr><th scope="col">N° ODS</th><th scope="col">Cliente</th><th scope="col">Fecha</th><th scope="col">Servicio</th><th scope="col">Técnico</th><th scope="col">Recibió</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead>
          <tbody id="tabla-certificados"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" id="modal-certificado" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-certificado">
    <div class="modal-caja" style="max-width:720px">
      <div class="modal-cabecera">
        <h2 id="titulo-modal-certificado">Certificado de servicio</h2>
        <button type="button" data-cerrar="modal-certificado" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-cuerpo">
        <div id="contenido-certificado"></div>
        <div class="modal-pie" style="margin-top:1rem">
          <button type="button" class="btn btn-secundario" data-cerrar="modal-certificado">Cerrar</button>
          <button type="button" class="btn btn-primario" id="btn-descargar">Descargar PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/certificado.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
